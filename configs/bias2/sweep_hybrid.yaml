# r08 UNSATURATED-INIT ABLATION (configs/bias2/, selected with IOTA_CONFIG_DIR=configs/bias2).
# Identical to configs/fixinit/ (r07) except ONE thing: decay_bias_init 6.0 -> 2.0 (legacy_gate_init stays false).
# r07 (bias 6, zero weight -> gamma0 = 0.9975, sigmoid'(6) = 0.0025) never learned to forget and lost
# most of its recall; pass 9 showed recall needs layer-0 forgetting. Bias 2 starts the gate at
# gamma0 = 0.88 with sigmoid'(2) = 0.105 (42x the gradient at bias 6), weight still zero.
# Paired with r04 and r07: seed 0, same lr, data, schedule and size. See PROGRESS.md 2026-10-07.
arch: hybrid
d_model: 256
n_layers: 5
n_heads: 4
d_ff: 512
dropout: 0.0
chunk_size: 64
decay_bias_init: 2.0
short_conv: 4
legacy_gate_init: false
full_attention_layers:
- 2
- 4
curriculum:
- mode: assoc_recall
  n_bindings:
    min: 2
    max: 64
  seq_len:
    min: 64
    max: 640
  n_queries:
    min: 1
    max: 16
  distractor_density: 0.1
  query_pos: uniform
  weight: 0.67
- mode: state_track
  n_bindings:
    min: 2
    max: 16
  seq_len:
    min: 64
    max: 640
  distractor_density: 0.1
  ops_kinds:
  - set
  weight: 0.33
train:
  batch_size: 64
  warmup: 200
  weight_decay: 0.01
  max_steps: 15000
  easy_steps: 1000
  ramp_steps: 2000
  eval_every: 500
  eval_n: 500
  patience: 8
  seed: 0
  lr: 0.00075
  run_name: hybrid_sweep
  grad_clip: 1.0
