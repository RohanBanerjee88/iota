# r07 INIT ABLATION (configs/fixinit/, selected with IOTA_CONFIG_DIR=configs/fixinit).
# Identical to configs/sweep_{arch}.yaml as trained in r04 (seed 0, same lr, data,
# schedule and size) except ONE thing: legacy_gate_init: false (the decay gate keeps its intended init).
# r01-r06 all trained with the GLA decay gate overwritten by the generic init
# (bias 0, random weight -> gamma ~ sigmoid(W.x), centred near 0.5) instead of the
# configured bias 6.0 / zero weight (gamma ~ 0.9975). See PROGRESS.md 2026-10-05.
# Paired with r04: same seed -> same data stream and same init for every other weight.
arch: gated_linear
d_model: 256
n_layers: 5
n_heads: 4
d_ff: 512
dropout: 0.0
chunk_size: 64
decay_bias_init: 6.0
short_conv: 4
legacy_gate_init: false
curriculum:
- mode: assoc_recall
  n_bindings:
    min: 2
    max: 64
  seq_len:
    min: 64
    max: 640
  n_queries:
    min: 1
    max: 16
  distractor_density: 0.1
  query_pos: uniform
  weight: 0.67
- mode: state_track
  n_bindings:
    min: 2
    max: 16
  seq_len:
    min: 64
    max: 640
  distractor_density: 0.1
  ops_kinds:
  - set
  weight: 0.33
train:
  batch_size: 64
  warmup: 200
  weight_decay: 0.01
  max_steps: 15000
  easy_steps: 1000
  ramp_steps: 2000
  eval_every: 500
  eval_n: 500
  patience: 8
  seed: 0
  lr: 0.0015
  run_name: gated_linear_sweep
  grad_clip: 1.0
