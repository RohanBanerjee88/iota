# r21: LONGER BUDGET, gate bias 2.0 (zero weight), GLA only, seed 0. Paper appendix A.2.
# r09 (bias 0) / r08 (bias 2) with max_steps 15000 -> 30000 and early stopping off (patience 1000).
# The cosine schedule stretches to 30k too, so the first 15k steps are NOT r09/r08's schedule.
# Question: does bias 2 catch up given time, or does the gap persist?
arch: gated_linear
d_model: 256
n_layers: 5
n_heads: 4
d_ff: 512
dropout: 0.0
chunk_size: 64
decay_bias_init: 2.0
short_conv: 4
legacy_gate_init: false
curriculum:
- mode: assoc_recall
  n_bindings:
    min: 2
    max: 64
  seq_len:
    min: 64
    max: 640
  n_queries:
    min: 1
    max: 16
  distractor_density: 0.1
  query_pos: uniform
  weight: 0.67
- mode: state_track
  n_bindings:
    min: 2
    max: 16
  seq_len:
    min: 64
    max: 640
  distractor_density: 0.1
  ops_kinds:
  - set
  weight: 0.33
train:
  batch_size: 64
  warmup: 200
  weight_decay: 0.01
  max_steps: 30000
  easy_steps: 1000
  ramp_steps: 2000
  eval_every: 500
  eval_n: 500
  patience: 1000
  seed: 0
  lr: 0.0015
  run_name: gated_linear_sweep
  grad_clip: 1.0
