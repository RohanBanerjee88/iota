# r32: SAME-LR CONTROL, gate bias 0.0 (zero weight), lr 0.00075, GLA only, seed 2. Paper appendix A.2.
# Identical to r12 (bias 0, lr 0.0015) except train.lr 0.0015 -> 0.00075, the lr at which bias 2 gave
# the best seed-0 GLA (r25: 0.93 at 32 facts; r08 at 0.0015: 0.14). Partner: r29 (bias 2, lr 0.00075,
# configs/tuned/bias2_s2). Question: at the same, lower lr, does the init still matter? PROGRESS.md 2026-10-17.
arch: gated_linear
d_model: 256
n_layers: 5
n_heads: 4
d_ff: 512
dropout: 0.0
chunk_size: 64
decay_bias_init: 0.0
short_conv: 4
legacy_gate_init: false
curriculum:
- mode: assoc_recall
  n_bindings:
    min: 2
    max: 64
  seq_len:
    min: 64
    max: 640
  n_queries:
    min: 1
    max: 16
  distractor_density: 0.1
  query_pos: uniform
  weight: 0.67
- mode: state_track
  n_bindings:
    min: 2
    max: 16
  seq_len:
    min: 64
    max: 640
  distractor_density: 0.1
  ops_kinds:
  - set
  weight: 0.33
train:
  batch_size: 64
  warmup: 200
  weight_decay: 0.01
  max_steps: 15000
  easy_steps: 1000
  ramp_steps: 2000
  eval_every: 500
  eval_n: 500
  patience: 8
  seed: 2
  lr: 0.00075
  run_name: gated_linear_sweep
  grad_clip: 1.0
