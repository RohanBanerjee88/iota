# NUDGED bias-0 init (configs/nudge/bias0/): identical to configs/zerow0 (r09 and the sw1 bias-0 cell) except
# decay_bias_init 0.0 -> 0.001 (gamma0 0.5 -> 0.50025). Used by the reproducibility sweep `rep1`
# (PROGRESS.md 2026-11-21): on the same seed, does a negligible change to the gate re-roll whether the run
# learns? The `bias0` cell of rep1 reruns configs/zerow0 exactly, as the no-change control.
arch: gated_linear
d_model: 256
n_layers: 5
n_heads: 4
d_ff: 512
dropout: 0.0
chunk_size: 64
decay_bias_init: 0.001
short_conv: 4
legacy_gate_init: false
curriculum:
- mode: assoc_recall
  n_bindings:
    min: 2
    max: 64
  seq_len:
    min: 64
    max: 640
  n_queries:
    min: 1
    max: 16
  distractor_density: 0.1
  query_pos: uniform
  weight: 0.67
- mode: state_track
  n_bindings:
    min: 2
    max: 16
  seq_len:
    min: 64
    max: 640
  distractor_density: 0.1
  ops_kinds:
  - set
  weight: 0.33
train:
  batch_size: 64
  warmup: 200
  weight_decay: 0.01
  max_steps: 15000
  easy_steps: 1000
  ramp_steps: 2000
  eval_every: 500
  eval_n: 500
  patience: 8
  seed: 0
  lr: 0.0015
  run_name: gated_linear_sweep
  grad_clip: 1.0
