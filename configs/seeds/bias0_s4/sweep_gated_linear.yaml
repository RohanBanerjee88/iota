# r40: SEED REPLICATE of r09 (gate bias0, zero gate weight, lr 0.0015 = the standard protocol), GLA ONLY, seed 4.
# Identical to configs/zerow0/sweep_gated_linear.yaml except train.seed 0 -> 4 (seeds 1 / 2: r10 / r12). This folder
# holds only the GLA config, so run_all trains and evaluates only the GLA (see run_all._archs).
# Partner: r39 (bias 2, seed 4). Takes the standard-lr bias 0 vs bias 2 contrast from 3 to 5 seeds.
# PROGRESS.md 2026-10-20.
arch: gated_linear
d_model: 256
n_layers: 5
n_heads: 4
d_ff: 512
dropout: 0.0
chunk_size: 64
decay_bias_init: 0.0
short_conv: 4
legacy_gate_init: false
curriculum:
- mode: assoc_recall
  n_bindings:
    min: 2
    max: 64
  seq_len:
    min: 64
    max: 640
  n_queries:
    min: 1
    max: 16
  distractor_density: 0.1
  query_pos: uniform
  weight: 0.67
- mode: state_track
  n_bindings:
    min: 2
    max: 16
  seq_len:
    min: 64
    max: 640
  distractor_density: 0.1
  ops_kinds:
  - set
  weight: 0.33
train:
  batch_size: 64
  warmup: 200
  weight_decay: 0.01
  max_steps: 15000
  easy_steps: 1000
  ramp_steps: 2000
  eval_every: 500
  eval_n: 500
  patience: 8
  seed: 4
  lr: 0.0015
  run_name: gated_linear_sweep
  grad_clip: 1.0
