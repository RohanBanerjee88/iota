# r02 CURRICULUM (after r01 failed the sanity gate -- see PROGRESS.md):
#  * control = OVERWRITE state_track (ops_kinds [set], `x = 88`): hold one value
#    across distance. The add/sub control was silent modular arithmetic that no
#    model learned, so it could not act as a control.
#  * recall keys are random + shuffled from [0,128) (dsl.py), so there is no
#    counting shortcut and every eval key has been seen in training.
#  * n_bindings <= 64 / n_queries <= 16: the capacity pass (2..128 bindings,
#    min(nb,16) queries) is in-distribution up to 64; only 128 extrapolates.
#  * short_conv 4 on EVERY mixer (attention and GLA): a 4-tap causal depthwise
#    conv that fuses neighbouring tokens. r02's lr probe: pure attention could not
#    learn multi-digit key matching (assoc 0.18) while the hybrid did (1.00); on CPU
#    the conv took transformer recall 0.26 -> 0.90 at the same budget. On for all
#    three so the comparison stays fair; attention cost stays O(T^2).
#  * TRAIN RECIPE from the r03 lr probe (runs/r03/tune.csv; same protocol for all):
#    lr picked per arch from {7.5e-4, 1.5e-3}; grad_clip 1.0, easy 1000 / ramp 2000
#    (the probe's schedule) and ONE common ceiling of 15000 steps with plateau
#    early-stop for every arch -- identical budget, each trained to its plateau.
#  * r04: n_layers 4 -> 5 so transformer, GLA and hybrid are matched in DEPTH and
#    PARAMS (~2.67M each). In r03 the hybrid (5 layers, 2.67M) beat a smaller
#    transformer (4 layers, 2.14M) -- this removes that size confound. Everything
#    else (data, conv, lr, schedule, seed) is identical to r03 on purpose.
#  * r05: seed 0 -> 1, a REPLICATE of r04 (same everything else). The seed now sets
#    both the weight init and the training-example stream; the held-out eval set and
#    every eval pass use the same prompts as r04, so the two runs are directly paired.
arch: transformer
d_model: 256
n_layers: 5
n_heads: 4
d_ff: 512
dropout: 0.0
short_conv: 4
curriculum:
- mode: assoc_recall
  n_bindings:
    min: 2
    max: 64
  seq_len:
    min: 64
    max: 640
  n_queries:
    min: 1
    max: 16
  distractor_density: 0.1
  query_pos: uniform
  weight: 0.67
- mode: state_track
  n_bindings:
    min: 2
    max: 16
  seq_len:
    min: 64
    max: 640
  distractor_density: 0.1
  ops_kinds:
  - set
  weight: 0.33
train:
  batch_size: 64
  warmup: 200
  weight_decay: 0.01
  max_steps: 15000
  easy_steps: 1000
  ramp_steps: 2000
  eval_every: 500
  eval_n: 500
  patience: 8
  seed: 1
  lr: 0.0015
  run_name: transformer_sweep
  grad_clip: 1.0
