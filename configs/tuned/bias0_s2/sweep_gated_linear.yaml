# r28: TUNED-LR full protocol, gate bias 0.0 (zero weight), lr 0.003, GLA only, seed 2. Paper appendix A.2.
# Identical to the bias-0 runs at lr 0.0015 (r09 / r10 / r12; configs/zerow0, configs/seeds/bias0_s*) on this seed except
# train.lr 0.0015 -> 0.003: this init's best in the 6k lr probe (r18: 0.29 / 0.32 / 0.42 held-out
# multi-query recall after 6k steps at lr 7.5e-4 / 1.5e-3 / 3e-3). Partner: r29 (bias2, lr 0.00075).
# Question: does bias 2 catch up when each init trains at the lr that suits it? PROGRESS.md 2026-10-15.
arch: gated_linear
d_model: 256
n_layers: 5
n_heads: 4
d_ff: 512
dropout: 0.0
chunk_size: 64
decay_bias_init: 0.0
short_conv: 4
legacy_gate_init: false
curriculum:
- mode: assoc_recall
  n_bindings:
    min: 2
    max: 64
  seq_len:
    min: 64
    max: 640
  n_queries:
    min: 1
    max: 16
  distractor_density: 0.1
  query_pos: uniform
  weight: 0.67
- mode: state_track
  n_bindings:
    min: 2
    max: 16
  seq_len:
    min: 64
    max: 640
  distractor_density: 0.1
  ops_kinds:
  - set
  weight: 0.33
train:
  batch_size: 64
  warmup: 200
  weight_decay: 0.01
  max_steps: 15000
  easy_steps: 1000
  ramp_steps: 2000
  eval_every: 500
  eval_n: 500
  patience: 8
  seed: 2
  lr: 0.003
  run_name: gated_linear_sweep
  grad_clip: 1.0
