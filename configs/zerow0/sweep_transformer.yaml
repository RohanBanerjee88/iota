# r09 ZERO-WEIGHT ABLATION (configs/zerow0/, selected with IOTA_CONFIG_DIR=configs/zerow0).
# Identical to configs/bias2/ (r08) except ONE thing: nothing -- no decay gate; matches r04 exactly, so r04's checkpoint is reused.
# The gate inits so far (seed 0, everything else identical):
#   r04  legacy: bias 0, small RANDOM weight (N(0, 0.02^2))   GLA 0.88 @32 facts, hybrid 1.00
#   r07  bias 6, ZERO weight (gamma0 0.9975, saturated)        GLA 0.36, hybrid 0.36
#   r08  bias 2, ZERO weight (gamma0 0.88)                     GLA 0.14, hybrid 1.00
#   r09  bias 0, ZERO weight (gamma0 0.5, input-independent)   differs from r04 ONLY in the gate weight
# See PROGRESS.md 2026-10-07.
arch: transformer
d_model: 256
n_layers: 5
n_heads: 4
d_ff: 512
dropout: 0.0
short_conv: 4
curriculum:
- mode: assoc_recall
  n_bindings:
    min: 2
    max: 64
  seq_len:
    min: 64
    max: 640
  n_queries:
    min: 1
    max: 16
  distractor_density: 0.1
  query_pos: uniform
  weight: 0.67
- mode: state_track
  n_bindings:
    min: 2
    max: 16
  seq_len:
    min: 64
    max: 640
  distractor_density: 0.1
  ops_kinds:
  - set
  weight: 0.33
train:
  batch_size: 64
  warmup: 200
  weight_decay: 0.01
  max_steps: 15000
  easy_steps: 1000
  ramp_steps: 2000
  eval_every: 500
  eval_n: 500
  patience: 8
  seed: 0
  lr: 0.0015
  run_name: transformer_sweep
  grad_clip: 1.0
